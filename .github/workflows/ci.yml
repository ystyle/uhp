name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    name: 构建 · 全部成员测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0
          components: stdx

      - name: Build（SDK + 两个适配器成员）
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: cjpm build -j 8

      # 三个成员分开跑：哪个成员卡住/失败一眼可见，也避免一个卡死拖住其它。
      # 每个都套 timeout，卡死时以失败结束而不是耗到 job 超时。
      - name: Tests · uhp（SDK）
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        working-directory: uhp
        run: timeout 900 cjpm test -j 4

      - name: Tests · uhp-opencode
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        working-directory: uhp-opencode
        run: timeout 600 cjpm test -j 4

      - name: Tests · uhp-acp
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        working-directory: uhp-acp
        run: |
          set +e
          cjpm test -j 4 & pid=$!
          for i in $(seq 1 30); do
            sleep 5
            if ! kill -0 $pid 2>/dev/null; then wait $pid; echo "tests exited: $?"; exit 0; fi
          done
          echo '=== 150s 未结束，抓线程状态'
          ps -eo pid,ppid,pgid,stat,comm | grep -E 'cjpm|testrunner|fake_agent' || true
          found=0
          for p in $(ps -eo pid,comm | grep -E 'testrunner' | grep -v grep | awk '{print $1}'); do
            found=1
            echo "=== process $p"
            for t in $(ls /proc/$p/task 2>/dev/null); do
              echo "--- tid $t comm=$(cat /proc/$p/task/$t/comm 2>/dev/null) state=$(awk '{print $3}' /proc/$p/task/$t/stat 2>/dev/null) wchan=$(cat /proc/$p/task/$t/wchan 2>/dev/null)"
              cat /proc/$p/task/$t/syscall 2>/dev/null
            done
            if ! command -v gdb >/dev/null; then sudo apt-get install -y -qq gdb >/dev/null 2>&1 || true; fi
            if command -v gdb >/dev/null; then sudo gdb -p $p -batch -ex 'thread apply all bt' 2>&1 | head -200 || true; fi
          done
          echo "testrunner found=$found"
          kill -9 $pid 2>/dev/null || true
          exit 1

      # 诊断用：单独跑权限用例，判断是「累积状态」还是「该用例必然卡」（PR 关闭前删除）
      - name: 单独跑权限用例
        if: always()
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        working-directory: uhp-acp
        run: timeout 180 cjpm test -j 4 --filter '*acp_permission*'

      # 诊断用：定位 ACP 测试在 runner 上的卡点（PR 关闭前删除）
      - name: 调试日志
        if: always()
        run: |
          cat /tmp/acp-dbg.log 2>/dev/null || echo "no dbg log"
          echo "=== 残留假 agent 进程数: $(pgrep -c -f fake_agent || echo 0)"

  artifact-check:
    name: 制品自包含检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Zxilly/setup-cangjie@v3
        with:
          channel: sts
          version: 1.2.0
          components: stdx

      - name: 打制品（跳过 lint 与测试，测试由上一步负责）
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: |
          set -e
          for m in uhp uhp-opencode uhp-acp; do
            (cd "$m" && timeout 300 cjpm bundle --skip-lint --skip-test)
          done

      - name: 解包后独立构建（证明制品自包含）
        env:
          CANGJIE_STDX_PATH: ${{ env.CANGJIE_STDX_PATH_STATIC }}/stdx
        run: |
          set -e
          for m in uhp uhp-opencode uhp-acp; do
            f=$(ls "$m"/target/*.cjp | head -1)
            d=$(mktemp -d)
            tar xzf "$f" -C "$d"
            root=$(ls -d "$d"/*)
            (cd "$root" && timeout 300 cjpm build -j 8)
            echo "OK: $m -> $(basename "$root")"
            rm -rf "$d"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cjp-artifacts
          path: |
            uhp/target/*.cjp
            uhp-opencode/target/*.cjp
            uhp-acp/target/*.cjp
          if-no-files-found: warn

  # 一致性套件（官方 uhp-conformance，Python 包，不在本仓）不进 CI：
  # 本地用 bash uhp/scripts/conformance.sh core|extended|full。
