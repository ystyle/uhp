[dependencies]

[package]
  cjc-version = "1.2.0"
  compile-option = "-Woff unused"
  description = "UHP (Unified Harness Protocol) 仓颉 SDK：协议类型层 + 客户端 + 服务端骨架"
  # 注意：M0/M1 的类型层、SSE 解析与客户端协议逻辑都不依赖 stdx 的网络/TLS，故暂不声明 link-option。
  # 接真实 HTTP 传输时会需要 digest（stdx.net.http 的 TLS 路径要 SHA-256，cjpm 不会自动推导）。
  #
  # 本机实测（2026-11-05，cjpm 1.2.0）：把 link-option = "-lstdx.crypto.digest" 加回来时，
  # **只有子包的测试二进制**（如 uhp.transport$test）链接失败（cannot find -lstdx.crypto.digest），
  # 根包与其它子包的测试二进制链接正常；与 a2a-cj 的 cjpm.toml 逐行对比完全一致，原因未定位。
  # 处理方式（已实测通过）：依赖网络的测试放在**根包**（src/std_http_test.cj），子包测试保持纯离线，
  # link-option 加回后整个仓 cjpm test 全绿。若将来子包测试也需要网络，先看这条注释。
  # stdx.net.http 的 TLS 路径需要 digest（SHA-256），cjpm 的依赖推导不会自动带上。
  link-option = "-lstdx.crypto.digest"
  name = "uhp"
  output-type = "static"
  version = "0.1.0"
  license = ["MulanPSL-2.0"]
  authors = ["ystyle"]
  repository = "https://atomgit.com/ystyle/uhp-cj"
  # 制品清单：只带源码与许可。include 一律锚定（未锚定会连带 example/src、tests/src）。
  include = ["/src", "/LICENSE"]
  exclude = ["/docs", "/tools", "/resources", "/scripts", "/examples", "/target"]

[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.aarch64-unknown-linux-gnu.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.aarch64-apple-darwin.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["${CANGJIE_STDX_PATH}"]

# 一致性套件的被测服务端（可执行，不进制品：exclude 已挡 /examples）
[package.package-configuration."uhp.examples.conformance_sut"]
  output-type = "executable"
  # 静态链接：SUT 常在没有 cjvs 环境的容器/CI 里跑，不能依赖 libcangjie-runtime.so
  compile-option = "--static"
